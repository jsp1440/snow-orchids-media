# Snow Orchids: copy every painting from Famous AI's storage into this repository, under paintings/.
# Free, and safe to run again: pictures already saved are skipped. Actions tab > "Archive paintings" > Run workflow.
name: Archive paintings
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: archive-paintings
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download every painting
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          pictures = json.load(open('paintings-list.json'))['pictures']
          saved = skipped = 0; failed = {}; total_bytes = 0
          def is_image(b): return b[:3] == b'\xff\xd8\xff' or b[:8] == b'\x89PNG\r\n\x1a\n' or (b[:4] == b'RIFF' and b[8:12] == b'WEBP') or b[:6] in (b'GIF87a', b'GIF89a')
          for name, url in pictures.items():
              dest = os.path.join('paintings', name)
              if os.path.exists(dest) and os.path.getsize(dest) > 2000:
                  skipped += 1; total_bytes += os.path.getsize(dest); continue
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              err = ''
              for attempt in range(4):
                  try:
                      data = urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'}), timeout=90).read()
                      if len(data) < 2000 or not is_image(data): raise ValueError(f'not a picture ({len(data)} bytes)')
                      open(dest, 'wb').write(data); saved += 1; total_bytes += len(data); err = ''; break
                  except Exception as e:
                      err = f'{type(e).__name__}: {e}'; time.sleep(4)
              if err: failed[name] = err; print('  FAILED', name, err, flush=True)
          report = {'pictures_in_list': len(pictures), 'saved_this_run': saved, 'already_saved': skipped, 'failed': failed, 'megabytes': round(total_bytes / 1e6, 1)}
          json.dump(report, open(os.path.join('paintings', 'archive-report.json'), 'w'), indent=1)
          print(json.dumps({k: v for k, v in report.items() if k != 'failed'}), '| failed:', len(failed))
          PY
      - name: Save the paintings
        if: always()
        run: |
          git config user.name "snow-orchids-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add paintings || true
          git diff --cached --quiet || git commit -q -m "Archive paintings from Famous AI storage"
          for attempt in 1 2 3 4; do
            if git pull -q --rebase origin "${{ github.ref_name }}" && git push -q; then echo "Saved."; break; fi
            sleep 8
          done
