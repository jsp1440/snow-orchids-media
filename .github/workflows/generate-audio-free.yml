# Snow Orchids: record the cast with Kokoro, an open-source voice model (Apache 2.0).
# Free: no account, no API key, no credits. Actions tab > "Record cast audio (free)" > Run workflow.
# Voices are set in kokoro-cast.json. The storybook plays the files this saves into audio/.
name: Record cast audio (free)
on:
  workflow_dispatch:
    inputs:
      chapter:
        description: 'Chapter number (1 to 9)'
        required: true
        default: '1'
      sample:
        description: 'Only the short Chapter 1 sample (about 2 minutes of audio)'
        type: boolean
        default: true
permissions:
  contents: write
concurrency: record-cast-audio
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the voice engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9.4" soundfile
      - name: Keep the downloaded voices between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-voices
      - name: Record
        run: python kokoro-audio.py --chapter "${{ inputs.chapter }}" ${{ inputs.sample && '--sample' || '' }}
      - name: Save the recordings
        if: always()
        run: |
          git config user.name "snow-orchids-audio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add audio || true
          git diff --cached --quiet || git commit -m "Cast audio (Kokoro): chapter ${{ inputs.chapter }}${{ inputs.sample && ' sample' || '' }}"
          git push
