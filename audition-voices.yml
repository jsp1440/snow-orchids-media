# Snow Orchids: audition narrator voices with Kokoro (free, no account, no key).
# Actions tab > "Audition narrator voices (free)" > Run workflow. Takes a few minutes.
# Saves short clips into the audition/ folder; open audition/README.md and tap a voice to listen. Changes nothing else.
name: Audition narrator voices (free)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: audition-voices
jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the voice engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9.4" soundfile
      - name: Keep the downloaded voices between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-voices
      - name: Record the audition clips
        run: python audition-voices.py
      - name: Save them
        run: |
          git config user.name "snow-orchids-audio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add audition
          git diff --cached --quiet || git commit -q -m "Narrator voice audition clips"
          for attempt in 1 2 3 4; do
            if git pull -q --rebase origin "${{ github.ref_name }}" && git push -q; then echo "Saved."; break; fi
            echo "Save attempt $attempt did not go through; trying again."; sleep 8
          done
